server {
  listen 80;
  server_tokens off;

  client_max_body_size 20M;

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000;
  }

  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000;
  }

  location /static/ {
    alias /staticfiles/;
  }

  location /media/ {
    alias /media/;
  }

  location / {
    root /staticfiles/;
    index index.html;
    try_files $uri /index.html;
  }
}
